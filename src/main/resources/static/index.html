<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braillector</title>

    <style>
        :root {
            --fondo: #f2f6ff;
            --encabezado: #d6e7ff;
            --panel: #f5f8ff;
            --texto: #1e2833;
            --borde: #b6c0cf;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Century Gothic', Arial, sans-serif;
            color: var(--texto);
            background: var(--fondo);
        }

        /* ENCABEZADO */
        header {
            height: 340px;
            background: var(--encabezado);
            border-bottom: 1px solid var(--borde);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 20px;
        }

        .logo {
            width: min(665px, 90%);
            height: 150px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .frase {
            margin: 0;
            font-size: 1.2rem;
            text-align: center;
        }

        /* DOS PANELES PRINCIPALES */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 340px);
        }

        .panel {
            background: var(--panel);
            padding: 30px 100px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .panel:first-child {
            border-right: 1px solid var(--borde);
        }

        h2 {
            margin: 0;
            font-size: 1.6rem;
            text-align: center;
        }

        /* ÁREA DE TEXTO */
        #texto {
            width: 100%;
            flex: 1;
            min-height: 200px;
            max-height: 600px;
            margin-top: 20px;
            padding: 25px;
            font: inherit;
            resize: none;
            border: 1px solid var(--borde);
            border-radius: 20px;
        }

        /* BOTONES */
        .botones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            font: inherit;
            border-radius: 8px;
            border: 1px solid var(--borde);
            background-color: #ffffff;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #e2ecfc;
        }


        #btn3d:hover, #btnBRF:hover {
            background-color: #218838;
        }

        #btn3d, #btnBRF {
            display: none;
            background-color: #28a745;
            color: white;
            border: none;
        }

        #btnCopiar {
            display: none;
        }

        /* RESULTADO */
        #resultado {
            margin-top: 20px;
            flex: 1;
            min-height: 200px;
            max-height: 600px;
            overflow-y: auto;
            padding: 25px;
            overflow-wrap: anywhere;
            font-size: 1.5rem;
            letter-spacing: 2px;
            border: 1px solid var(--borde);
            border-radius: 20px;
            background: #ffffff;
        }

        /* PANTALLAS PEQUEÑAS */
        @media (max-width: 650px) {
            header {
                height: auto;
                min-height: 220px;
            }

            main {
                grid-template-columns: 1fr;
                height: auto;
            }

            .panel:first-child {
                border-right: none;
                border-bottom: 1px solid var(--borde);
            }

            .panel {
                min-height: 350px;
                padding: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <img src="/logo.png" alt="Braillector">
    </div>

    <p class="frase">Traduce una oración de Español a Braille</p>
</header>

<main>

    <!-- PANEL IZQUIERDO -->
    <section class="panel">
        <h2>Introduce tu texto</h2>

        <textarea
                id="texto"
                placeholder="Escribe una palabra u oración"
        ></textarea>

        <div class="botones">
            <button type="button" onclick="traducir()">
                Traducir
            </button>
            <button
                    type="button"
                    onclick="document.getElementById('fileInput').click()">Subir archivo</button>
            <input
                    type="file"
                    id="fileInput"
                    accept=".pdf, .txt"
                    style="display: none;"
                    onchange="leerArchivo(event)">
            <button
                    type="button"
                    id="btnMic"
                    onclick="iniciarDictado()"
                    title="Dictar por voz"
                    style="display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
        </div>
    </section>

    <!-- PANEL DERECHO -->
    <section class="panel">
        <h2>Traducción a Braille</h2>

        <div id="resultado"></div>

        <div class="botones">
            <button
                    type="button"
                    id="btnCopiar"
                    onclick="copiarTexto()"
            >Copiar texto</button>
            <button
                    type="button"
                    id="btn3d"
                    onclick="descargarSTL()"
                    title="Generar modelo 3D para impresión"
            >Descargar 3D (.stl)</button>
            <button
                    type="button"
                    id="btnBRF"
                    onclick="descargarBRF()"
                    title="Descargar para impresora Braille"
            >Descargar BRF</button>
        </div>
    </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
    let textoBrailleActual = "";

    async function traducir() {
        const texto = document.getElementById('texto').value;

        const respuesta = await fetch('/api/braille/traducir', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ texto })
        });

        const datos = await respuesta.json();

        if (datos.braille) {
            textoBrailleActual = datos.braille;
            document.getElementById('resultado').textContent = datos.braille;
            document.getElementById('btn3d').style.display = 'inline-block';
            document.getElementById('btnBRF').style.display = 'inline-block';
            document.getElementById('btnCopiar').style.display = 'inline-block';
        } else {
            textoBrailleActual = "";
            document.getElementById('resultado').textContent = datos.error;
            document.getElementById('btn3d').style.display = 'none';
            document.getElementById('btnBRF').style.display = 'none';
            document.getElementById('btnCopiar').style.display = 'none';
        }
    }

    function iniciarDictado() {
        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('Tu navegador no soporta el dictado por voz.');
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'es-MX';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const btnMic = document.getElementById('btnMic');
        const inputTexto = document.getElementById('texto');

        btnMic.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity: 0.5;"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg> Escuchando...`;

        recognition.onresult = function(event) {
            inputTexto.value = event.results[0][0].transcript;
            traducir();
        };

        recognition.onerror = function() {
            alert('No se pudo reconocer la voz. Inténtalo de nuevo.');
        };

        recognition.onend = function() {
            btnMic.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`;
        };

        recognition.start();
    }

    // --- Generación de archivo STL para impresión 3D ---
    function descargarSTL() {
        if (!textoBrailleActual) return;

        let stlContent = "solid braille_plaque\n";

        const anchoCelda = 6.0;   // mm
        const altoCelda = 10.0;   // mm
        const radioPunto = 0.75;  // mm (diámetro 1.5mm estándar CBE)
        const alturaPunto = 0.6;  // mm (relieve para lectura táctil)
        const espesorBase = 2.0;  // mm

        const totalCeldas = textoBrailleActual.length;
        const largoBase = (totalCeldas * anchoCelda) + 4; // Margen exterior

        // Base rectangular
        stlContent += generarCajaSTL(0, 0, 0, largoBase, altoCelda, espesorBase);

        // Puntos en relieve
        let xOffset = 3;
        for (let i = 0; i < textoBrailleActual.length; i++) {
            const charCode = textoBrailleActual.charCodeAt(i);

            if (charCode >= 0x2800 && charCode <= 0x28FF) {
                const mask = charCode - 0x2800;

                // Puntos 1 al 6 según codificación Braille Unicode
                if (mask & 0x01) stlContent += generarCilindroSTL(xOffset + 1.2, 7.5, espesorBase, radioPunto, alturaPunto); // Punto 1
                if (mask & 0x02) stlContent += generarCilindroSTL(xOffset + 1.2, 5.0, espesorBase, radioPunto, alturaPunto); // Punto 2
                if (mask & 0x04) stlContent += generarCilindroSTL(xOffset + 1.2, 2.5, espesorBase, radioPunto, alturaPunto); // Punto 3
                if (mask & 0x08) stlContent += generarCilindroSTL(xOffset + 3.6, 7.5, espesorBase, radioPunto, alturaPunto); // Punto 4
                if (mask & 0x10) stlContent += generarCilindroSTL(xOffset + 3.6, 5.0, espesorBase, radioPunto, alturaPunto); // Punto 5
                if (mask & 0x20) stlContent += generarCilindroSTL(xOffset + 3.6, 2.5, espesorBase, radioPunto, alturaPunto); // Punto 6
            }
            xOffset += anchoCelda;
        }

        stlContent += "endsolid braille_plaque\n";

        // Crear enlace directo para descargar el archivo .stl
        const blob = new Blob([stlContent], { type: 'model/stl' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'traduccion_braille_3d.stl';
        link.click();
    }

    function generarCajaSTL(x, y, z, dx, dy, dz) {
        return `  facet normal 0 0 -1\n    outer loop\n      vertex ${x} ${y} ${z}\n      vertex ${x+dx} ${y} ${z}\n      vertex ${x+dx} ${y+dy} ${z}\n    endloop\n  endfacet\n` +
            `  facet normal 0 0 1\n    outer loop\n      vertex ${x} ${y} ${z+dz}\n      vertex ${x+dx} ${y+dy} ${z+dz}\n      vertex ${x} ${y+dy} ${z+dz}\n    endloop\n  endfacet\n`;
    }

    function generarCilindroSTL(cx, cy, cz, r, h) {
        let cilindro = "";
        const pasos = 8;
        for (let i = 0; i < pasos; i++) {
            let a1 = (i * 2 * Math.PI) / pasos;
            let a2 = ((i + 1) * 2 * Math.PI) / pasos;

            let x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
            let x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);

            cilindro += `  facet normal 0 0 1\n    outer loop\n      vertex ${cx} ${cy} ${cz+h}\n      vertex ${x1} ${y1} ${cz+h}\n      vertex ${x2} ${y2} ${cz+h}\n    endloop\n  endfacet\n`;
        }
        return cilindro;
    }

    // --- Función para copiar el texto ---
    function copiarTexto() {
        if (!textoBrailleActual) return;
        navigator.clipboard.writeText(textoBrailleActual).then(() => {
            alert('¡Texto copiado al portapapeles!');
        }).catch(err => {
            console.error('Error al copiar: ', err);
        });
    }

    // --- Función para leer archivo de texto ---
    async function leerArchivo(event) {
        const file = event.target.files[0];
        if (!file) return;

        // --- CASO 1: ES UN ARCHIVO .TXT ---
        if (file.type === "text/plain" || file.name.endsWith('.txt')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // El archivo de texto se lee directo y respeta los saltos de línea
                document.getElementById('texto').value = e.target.result;
                traducir();
            };
            reader.readAsText(file);
            event.target.value = ''; // Limpiar
            return; // Terminamos aquí para que no siga al código del PDF
        }

        // --- CASO 2: ES UN ARCHIVO .PDF (Tu código original) ---
        const reader = new FileReader();
        reader.onload = async function() {
            const typedarray = new Uint8Array(this.result);

            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            try {
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let textoCompleto = "";

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const textItems = textContent.items.map(item => item.str);
                    textoCompleto += textItems.join(" ") + "\n";
                }

                document.getElementById('texto').value = textoCompleto.trim();
                traducir();

            } catch (error) {
                alert("Hubo un error al leer el PDF.");
                console.error(error);
            }
        };
        reader.readAsArrayBuffer(file);
        event.target.value = '';
    }

    // --- Generación de archivo BRF para impresoras Braille ---
    function descargarBRF() {
        if (!textoBrailleActual) return;

        // Diccionario de Braille Unicode a ASCII Braille (Estándar)
        const brailleToAscii = {
            '⠁': 'a', '⠃': 'b', '⠉': 'c', '⠙': 'd', '⠑': 'e', '⠋': 'f', '⠛': 'g', '⠓': 'h', '⠊': 'i', '⠚': 'j',
            '⠅': 'k', '⠇': 'l', '⠍': 'm', '⠝': 'n', '⠕': 'o', '⠏': 'p', '⠟': 'q', '⠗': 'r', '⠎': 's', '⠞': 't',
            '⠥': 'u', '⠧': 'v', '⠺': 'w', '⠭': 'x', '⠽': 'y', '⠵': 'z',
            '⠻': 'n', // ñ (simplificado para BRF)
            '⠷': 'a', '⠮': 'e', '⠌': 'i', '⠬': 'o', '⠾': 'u', '⠼': 'u', // Acentos (se imprimen como vocal base)
            '⠄': ',', // Signo de mayúscula
            '⠼': '#', // Signo de número
            '⠲': '4', '⠂': '1', '⠆': '2', '⠒': '3', '⠖': '6', '⠢': '8', // Puntuación ASCII Braille
            '⠣': '(', '⠬': '+', '⠤': '-', '⠡': '*', '⠌': '/', '⠶': '=',
            ' ': ' ', '\n': '\n'
        };

        // Convertir el texto
        let textoAscii = "";
        for (let i = 0; i < textoBrailleActual.length; i++) {
            textoAscii += brailleToAscii[textoBrailleActual[i]] || ' '; // Si hay un error, pone un espacio
        }

        // Formatear a 40 columnas x 25 líneas
        const anchoMaximo = 40;
        const lineasPorPagina = 25;
        let brfFinal = "";
        let contadorLineasPagina = 0;

        const parrafos = textoAscii.split('\n');

        for (let parrafo of parrafos) {
            if (parrafo.trim() === "") {
                brfFinal += "\n";
                contadorLineasPagina++;
                if (contadorLineasPagina >= lineasPorPagina) { brfFinal += "\f"; contadorLineasPagina = 0; }
                continue;
            }

            const palabras = parrafo.split(' ');
            let lineaActual = "";

            for (let palabra of palabras) {
                // Si una palabra es gigante, la cortamos a la fuerza
                while (palabra.length > anchoMaximo) {
                    if (lineaActual.length > 0) {
                        brfFinal += lineaActual.trim() + "\n";
                        contadorLineasPagina++;
                        if (contadorLineasPagina >= lineasPorPagina) { brfFinal += "\f"; contadorLineasPagina = 0; }
                        lineaActual = "";
                    }
                    brfFinal += palabra.substring(0, anchoMaximo) + "\n";
                    contadorLineasPagina++;
                    if (contadorLineasPagina >= lineasPorPagina) { brfFinal += "\f"; contadorLineasPagina = 0; }
                    palabra = palabra.substring(anchoMaximo);
                }

                // Si la palabra cabe en la línea actual, la agregamos
                if (lineaActual.length + palabra.length + 1 > anchoMaximo) {
                    brfFinal += lineaActual.trim() + "\n";
                    contadorLineasPagina++;
                    if (contadorLineasPagina >= lineasPorPagina) { brfFinal += "\f"; contadorLineasPagina = 0; }
                    lineaActual = palabra + " ";
                } else {
                    lineaActual += palabra + " ";
                }
            }

            if (lineaActual.trim().length > 0) {
                brfFinal += lineaActual.trim() + "\n";
                contadorLineasPagina++;
                if (contadorLineasPagina >= lineasPorPagina) { brfFinal += "\f"; contadorLineasPagina = 0; }
            }
        }

        // Descargar el archivo
        const blob = new Blob([brfFinal], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'traduccion_braille.brf';
        link.click();
    }

</script>
</body>
</html>
